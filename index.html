<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿月在想谁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 42px;
            color: #f0e68c;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .wheel-wrapper {
            position: relative;
            display: inline-block;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #d63031;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
            z-index: 10;
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            z-index: 10;
            pointer-events: none;
            user-select: none;
        }
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-spin {
            background: #d63031;
            color: #fff;
            box-shadow: 0 4px 15px rgba(214, 48, 49, 0.4);
        }
        .btn-spin:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(214, 48, 49, 0.5); }
        .btn-spin:active { transform: translateY(0); }
        .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-stop {
            background: #636e72;
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 110, 114, 0.3);
        }
        .btn-stop:hover { transform: translateY(-2px); background: #2d3436; }
        .btn-stop:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .result {
            margin-top: 25px;
            font-size: 28px;
            font-weight: bold;
            color: #d63031;
            min-height: 50px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.8);
            border-radius: 15px;
            display: inline-block;
            transition: all 0.3s;
        }
        .result.highlight {
            animation: pop 0.5s ease;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💭 阿月在想谁</h1>
    <p class="subtitle">转盘揭晓，你心里有谁！</p>

    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
        <div class="center-circle">💕</div>
    </div>

    <div class="controls">
        <button class="btn btn-spin" id="spinBtn">🎰 转起来！</button>
        <button class="btn btn-stop" id="stopBtn" disabled>⏹ 停！</button>
    </div>

    <div class="result" id="result">在想谁呢...</div>
</div>

<script>
    const foods = [
        '👤 马飞', '👤 虎虎', '👤 洁洁', '💔 前男友'
    ];
    const colors = [
        '#3498db', '#e67e22', '#e74c3c', '#8e44ad'
    ];
    const EX_BOYFRIEND = '💔 前男友';

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const stopBtn = document.getElementById('stopBtn');
    const result = document.getElementById('result');

    const centerX = 200, centerY = 200, radius = 190;
    const sliceAngle = (2 * Math.PI) / foods.length;
    let currentAngle = 0;
    let spinning = false;
    let animId = null;
    let speed = 0;
    let decelerating = false;

    function drawWheel(angle) {
        ctx.clearRect(0, 0, 400, 400);
        for (let i = 0; i < foods.length; i++) {
            const start = angle + i * sliceAngle;
            const end = start + sliceAngle;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, start, end);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(start + sliceAngle / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 3;
            ctx.fillText(foods[i], radius - 15, 5);
            ctx.restore();
        }
        ctx.beginPath();
        ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }

    function getResult(angle) {
        const pointerAngle = (3 * Math.PI / 2) - angle;
        const normalized = ((pointerAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const idx = Math.floor(normalized / sliceAngle);
        return foods[idx % foods.length];
    }

    function spin() {
        if (spinning) return;
        spinning = true;
        decelerating = false;
        speed = 0.3 + Math.random() * 0.15;
        spinBtn.disabled = true;
        stopBtn.disabled = false;
        result.textContent = '转盘中...';
        result.classList.remove('highlight');

        function animate() {
            currentAngle += speed;
            drawWheel(currentAngle);
            if (decelerating) {
                speed *= 0.99;
                if (speed < 0.005) {
                    speed = 0;
                    spinning = false;
                    spinBtn.disabled = false;
                    stopBtn.disabled = true;
                    const r = getResult(currentAngle);
                    const rand = Math.random() * 100;
                    let finalResult;
                    if (rand < 95.99) {
                        finalResult = EX_BOYFRIEND;
                    } else {
                        const others = foods.filter(f => f !== EX_BOYFRIEND);
                        finalResult = others[Math.floor(Math.random() * others.length)];
                    }
                    result.textContent = '💕 在想：' + finalResult;
                    result.classList.add('highlight');
                    return;
                }
            }
            animId = requestAnimationFrame(animate);
        }
        animate();
    }

    function stop() {
        if (!spinning || decelerating) return;
        decelerating = true;
        stopBtn.disabled = true;
    }

    spinBtn.addEventListener('click', spin);
    stopBtn.addEventListener('click', stop);

    drawWheel(0);
</script>

</body>
</html>
